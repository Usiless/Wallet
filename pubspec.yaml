name: finanzas_locales
description: "Cabal: finanzas personales local-first para Android, sin servidor ni telemetría."
publish_to: 'none'
version: 0.1.1+3

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  crypto: ^3.0.7
  cryptography: ^2.9.0
  drift: 2.34.0
  sqlite3: ^3.7.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  http: ^1.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
